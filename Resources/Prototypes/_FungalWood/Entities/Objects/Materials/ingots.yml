- type: entity
  abstract: true
  parent: BaseItem
  id: FWIngotBase
  description: A heavy metal ingot.
  components:
  - type: Sprite
    sprite: Objects/Materials/ingots.rsi
  - type: Item
    sprite: Objects/Materials/ingots.rsi
    size: Normal
  - type: Tag
    tags:
    - Ingot
    - ConstructionMaterial
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
#copper
- type: entity
  parent: FWIngotBase
  id: FWCopperIngot
  name: copper ingot
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      FWCopper: 100
  - type: Stack
    stackType: FWCopper
    baseLayer: base
    layerStates:
    - copper
    - copper_2
    - copper_3
  - type: Sprite
    state: copper_3
    layers:
    - state: copper_3
      map: ["base"]
  - type: Item
    heldPrefix: copper
  - type: Appearance

- type: entity
  parent: FWCopperIngot
  id: FWCopperIngot1
  suffix: Single
  components:
  - type: Stack
    count: 1

- type: entity
  parent: FWCopperIngot
  id: FWCopperIngot5
  suffix: Five
  components:
  - type: Stack
    count: 5

- type: entity
